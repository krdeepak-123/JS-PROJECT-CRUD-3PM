<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../styles/index.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <figure class="logo">Crud-App</figure>

      <nav class="navlinks">
        <a href="./CreateUser.html"> Create User </a>
        <a href="./Users.html"> All Users </a>
      </nav>
    </header>

    <!-- MAIN-CONTAINER -->
    <main class="main-container">
      <h1>Create user</h1>

      <form id="form">
        <label for="fullname">Fullname</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter fullname" required>

        <br>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Enter Email" required>

        <br>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter Password" required>

        <br>

        <button>Create</button>
      </form>


    </main>


    <script src="../scripts/CreateUser.js"></script>
  </body>
</html>
